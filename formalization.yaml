    authors: ["Leticia Pardo-Simón", "David J. Sixsmith"]
    id: "arXiv:2607.09462"
    type: "paper"
    location: "Theorem 1.1"
    relationship: "formalizes"
    note: "The first part of the registered statement (unbounded counts)."
    author_endorsement: "not-contacted"
  - title: "Hyperbolic entire functions with full hyperbolic dimension and approximation by Eremenko-Lyubich functions"
    authors: ["Lasse Rempe-Gillen"]
    id: "arXiv:1106.3439"
    type: "paper"
    relationship: "formalizes"
    note: "The approximation step for the tracts used in the first part is proved here, not assumed."
    author_endorsement: "not-contacted"
  - title: "A cofinal bound for maximum-modulus points of entire functions"
    authors: ["Yunpeng Li"]
    id: "https://github.com/liyunpeng1991/liyunpeng1991.github.io/blob/c063e5f83dfa71c97871eabc8b70cf8a8c1e0bc9/papers/maximum-modulus-points-v2.pdf"
    type: "preprint"
    location: "version 2, 11 October 2026"
    relationship: "formalizes"
    note: "The second part of the registered statement (a cofinal finite bound)."
    author_endorsement: "not-contacted"
  - title: "Erdős Problem #1117"
    contributors:
