status:
  scope: >-
    Complete formalization of both questions as stated in
    MaxModulusPoints.Statement. ν counts exact maximum points as an extended
    natural number, so an infinite set of maximum points counts as ⊤; monomials
    include the constants and the zero function.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-6.1 Sol", "GPT-6 Luna", "Claude Opus 5.5", "Grok 4.7"]
      framework: "Codex CLI, Claude Code and Grok CLI"
      tool_setup: >-
        The author fixed the target statement and the acceptance criteria in
        advance: the result depends only on Lean's standard axioms and is
        accepted by Comparator against the challenge statement. AI coding
        agents wrote the proof, and later ported it to Lean v4.35.0 and the
        module system.
      cost:
        spend_usd: "subscription-based usage"
        hardware: "API-only models; local builds on an Apple Silicon Mac"
  spend_usd: "subscription-based usage"
  notes: >-
    The author is responsible for the content. Model agreement was not
    treated as verification; acceptance rests on the Lean kernel checks
    described under review.

fidelity:
  divergences: >-
    None known. The statement keeps both questions, the exact maximum points
    (by comparison of function values, not by a supremum), and positive radii
    larger than every given bound.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    This revision passed a full build with scripts/verify.sh (the theorem
    depends only on propext, Classical.choice and Quot.sound), a kernel replay
    with leanchecker --fresh, and Comparator with the NanoDa kernel and Lean's
    default kernel; a disposable challenge with ∀ N changed to ∃ N in
    UnboundedCounts was rejected. A vendor check reproduces every vendored file
    from its recorded upstream and patch. No independent human expert has
    reviewed the formalization. Details are in docs/verification.md.

alignment:
  namespace: "MaxModulusPoints"
  statements:
    - source: "Hayman–Lingham Problem 2.16 / Erdős Problem 1117, both questions"
      lean: "MaxModulusPoints.Blueprint.main"
      module: "MaxModulusPoints/Blueprint/Main.lean"
      status: "proved"
      note: >-
        First conjunct: Pardo-Simón–Sixsmith, Theorem 1.1. Second conjunct:
        Li's cofinal bound. Compared by Comparator with the statement of the
        same name in Challenge.lean, with every definition compared by body.

acknowledgements: >-
  Mathlib, OpenAI's mathematics library, TauCeti and FixedPointTheorems supply
