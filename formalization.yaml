# formalization.yaml (v0.4) for the Palomar Registry submission of this revision.
version: "v0.4"

project:
  name: "Maximum-modulus points of entire functions (Erdős Problem 1117), in Lean 4"
  description: >-
    A Lean 4 formalization of both maximum-modulus counting questions of
    Hayman–Lingham Problem 2.16 (Erdős Problem 1117). For an entire function f
    and a radius r, let ν(f, r) be the number of points on the circle |z| = r
    where |f| attains its maximum on that circle. The registered theorem proves
    two things: some non-monomial entire function has ν(f, r) unbounded along
    radii tending to infinity; and for every non-monomial entire function there
    is one finite bound B with ν(f, r) ≤ B along a cofinal set of radii, so the
    counts never tend to infinity. The first part follows Pardo-Simón and
    Sixsmith's finite-order construction and proves the approximation step of
    Rempe-Gillen that it uses; the second follows Li's cofinal-bound argument.
    The theorem depends only on the axioms propext, Classical.choice and
    Quot.sound.
  authors:
    - "Yao Xu"
  responsible_maintainers:
    - "Yao Xu"
  license: "Apache-2.0"

classification:
  arxiv: ["math.CV", "math.DS"]
  msc2020: ["30D20", "30D15", "37F10"]

sources:
